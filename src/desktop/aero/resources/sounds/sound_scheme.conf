; ZirconOS Aero Sound Scheme
; Copyright (C) 2024-2026 ZirconOS Project
; Licensed under LGPL-2.1
; All sounds to be original compositions - not derived from any third-party OS
;
; Physical files use Desktop.ini-style names under theme directories.
; Default logical scheme below references Nature/ (ZirconOS Crystal); swap the
; folder prefix to Architecture, Characters, Landscapes, or Scenes for other themes.
; See sounds/README.md for event-to-file mapping and tools/soundgen/ for regeneration.

[SoundScheme]
name = ZirconOS Crystal
version = 1.0
description = Glass-inspired ambient sound scheme for ZirconOS Aero
author = ZirconOS Project
license = LGPL-2.1
format = WAV
sample_rate = 44100
bit_depth = 16
channels = stereo

; =========================================================================
; System Events - Core OS lifecycle sounds
; =========================================================================

[SystemEvents]
startup = Nature/ZirconOS Startup.wav
shutdown = Nature/ZirconOS Shutdown.wav
logon = Nature/ZirconOS Logon Sound.wav
logoff = Nature/ZirconOS Logoff Sound.wav
lock = Nature/ZirconOS Default.wav
unlock = Nature/ZirconOS Notify.wav
sleep = Nature/ZirconOS Battery Low.wav
wake = Nature/ZirconOS Ding.wav

; =========================================================================
; Dialog Events - User feedback and prompts
; =========================================================================

[DialogEvents]
error = Nature/ZirconOS Error.wav
warning = Nature/ZirconOS Exclamation.wav
notification = Nature/ZirconOS Notify.wav
information = Nature/ZirconOS Information Bar.wav
question = Nature/ZirconOS Default.wav
critical_stop = Nature/ZirconOS Critical Stop.wav

; =========================================================================
; Navigation Events - File management and browsing
; =========================================================================

[NavigationEvents]
navigate_forward = Nature/ZirconOS Navigation Start.wav
navigate_back = Nature/ZirconOS Navigation Start.wav
open_folder = Nature/ZirconOS Default.wav
close_folder = Nature/ZirconOS Balloon.wav
delete_item = Nature/ZirconOS Hardware Remove.wav
recycle = Nature/ZirconOS Print complete.wav
empty_recycle = Nature/ZirconOS Critical Stop.wav

; =========================================================================
; Window Events - Window management
; =========================================================================

[WindowEvents]
minimize = Nature/ZirconOS Pop-up Blocked.wav
maximize = Nature/ZirconOS Ding.wav
restore = Nature/ZirconOS Notify.wav
close_window = Nature/ZirconOS Logoff Sound.wav
snap = Nature/ZirconOS Navigation Start.wav
menu_open = Nature/ZirconOS Default.wav
menu_close = Nature/ZirconOS Balloon.wav
menu_select = Nature/ZirconOS Ding.wav

; =========================================================================
; Device Events - Hardware connections
; =========================================================================

[DeviceEvents]
device_connect = Nature/ZirconOS Hardware Insert.wav
device_disconnect = Nature/ZirconOS Hardware Remove.wav
device_fail = Nature/ZirconOS Hardware Fail.wav
battery_low = Nature/ZirconOS Battery Low.wav
battery_critical = Nature/ZirconOS Battery Critical.wav

; =========================================================================
; Communication Events - Messaging and networking
; =========================================================================

[CommunicationEvents]
new_message = Nature/ZirconOS Notify.wav
new_mail = Nature/ZirconOS Notify.wav
calendar_reminder = Nature/ZirconOS Exclamation.wav
instant_message = Nature/ZirconOS Balloon.wav
call_incoming = Nature/ZirconOS User Account Control.wav
call_end = Nature/ZirconOS Logoff Sound.wav

; =========================================================================
; Interaction Events - UI feedback
; =========================================================================

[InteractionEvents]
click = Nature/ZirconOS Default.wav
hover_button = Nature/ZirconOS Information Bar.wav
toggle_on = Nature/ZirconOS Ding.wav
toggle_off = Nature/ZirconOS Notify.wav
search_complete = Nature/ZirconOS Print complete.wav
print_complete = Nature/ZirconOS Print complete.wav
screenshot = Nature/ZirconOS Hardware Insert.wav

; =========================================================================
; Sound Design Notes
; =========================================================================

; Design philosophy:
;   - Crystal glass aesthetic: clean tones, subtle resonance, no harshness
;   - Startup/shutdown: 3-5 second ambient crystal chimes, layered harmonics
;   - Errors/warnings: short tonal cues (< 1 second), distinct but not alarming
;   - Navigation: micro-interactions (< 0.3 seconds), soft taps and slides
;   - Window events: glass movement sounds, subtle whooshes
;   - Device events: connection tones with ascending/descending pitch
;   - All sounds use a consistent tonal palette rooted in C major / A minor
;   - Reverb and spatial audio for a glassy, open atmosphere
;
; Target loudness: -18 LUFS (integrated)
; Peak: -1 dBTP
