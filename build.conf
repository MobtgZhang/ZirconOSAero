# ZirconOSAero (NT 6.1 / Windows 7 风格) — 构建配置
# 覆盖方式: make DESKTOP=aero BOOT_METHOD=uefi
#
# 本仓库仅使用自研 ZirconOSAero Boot Manager (ZBM)。

# ── Architecture ──
# Supported: x86_64, aarch64, loongarch64, riscv64, mips64el
# ARCH = x86_64
ARCH = x86_64

# ── Boot Method ──
# mbr   — Legacy BIOS (Master Boot Record) → ZBM
# uefi  — UEFI firmware (GPT + ESP) → ZBM
# （x86/aarch64 ISO/ESP 含义；LoongArch 下 make run 的 QEMU 方式见 LOONGARCH64_QEMU_MODE）
# AArch64 / RISC-V：图形与 QEMU 固定走 `make run-aarch64` / `make run-riscv64`（内含 `build-esp ARCH=…`、固件、pflash/-bios）；`zig build` 产出内核与 ZBM，不替代上述 UEFI 启动命令。
BOOT_METHOD = uefi

# ── LoongArch QEMU（仅 ARCH=loongarch64 时有效）──
# uefi   — -bios + ESP + startup.nsh，需 QEMU_EFI.fd；ZBM 经 fix_pe_reloc 修正后应可加载
# LOONGARCH64_USE_C_STUB = 1 时使用 C stub，否则使用 Zig ZBM
# kernel — -kernel 直启：内核内 ZBM 风格菜单（串口可见），ramfb 在部分 QEMU 上无显示
LOONGARCH64_QEMU_MODE = uefi
# virt 机 -M virt,graphics=…：on 时 Aero/ramfb 易在 GTK 主窗可见；off 时 QEMU 常仍标「GOP 1024×768」且画面黑/旧固件（Makefile 默认 on，可在此覆盖）
LOONGARCH64_VIRT_GRAPHICS = on
# QEMU 显示：0=仅 ramfb；1=ramfb+virtio-gpu-pci（默认，固件可枚举 VirtIO 显示）；2=仅 virtio-gpu（无 fw_cfg ramfb，实验）
# LOONGARCH64_QEMU_VIRTIO_GPU = 1

# ── Bootloader ──
# 仅 zbm
BOOTLOADER = zbm

# ── Desktop Theme ──
# 默认 Aero（Vista/7 玻璃风格），与 NT 6.x 视觉一致
DESKTOP=aero

# ── Build Optimization ──
OPTIMIZE = Debug

# ── Display / QEMU ──
# QEMU GTK：默认 1:1 像素（Makefile QEMU_GTK_ZOOM=zoom-to-fit=off），窗口客户区随下方 RESOLUTION 更一致；若要把画面缩进小窗，用: make run-qemu-zoom-fit
# 分辨率：只保留一行未注释的 RESOLUTION=WxHxdepth；make build 会 sync 到 src/config/*.conf 与 build/tmp/zircon_pref_fb.h（LoongArch stub/ramfb 与内核同源，非写死常量）。
# RESOLUTION = 640x480x32
# RESOLUTION = 1024x768x32
# RESOLUTION = 1280x800x32
# RESOLUTION = 1280x1024x32
# RESOLUTION = 1366x768x32
# RESOLUTION = 1440x900x32
RESOLUTION = 1600x900x32
# RESOLUTION = 1680x1050x32
# RESOLUTION = 1920x1080x32
# RESOLUTION = 1920x1200x32
# RESOLUTION = 2560x1440x32
# RESOLUTION = 2560x1600x32
# RESOLUTION = 3840x2160x32
# 全表编译校验：./scripts/test_x86_resolution_matrix.sh（--quick 为 CI 三档）；LoongArch 见 scripts/test_loongarch_resolution_matrix.sh。
# QEMU_MEM 表示的是QEMU分配的内存大小，默认8GB
QEMU_MEM = 8G

# ── Features ──
ENABLE_IDT = true
DEBUG_LOG = true
# 鼠标坐标 / VirtIO 队列快照：构建时 make MOUSE_DEBUG=true 或 zig build -Dmouse_debug=true
MOUSE_DEBUG = false
# 桌面合成 bisect：make DESKTOP_BISECT=true 或 zig build -Ddesktop_bisect=true；panic 可带 [phase=0x…]（panic_context）
# DESKTOP_BISECT = true
# Agent NDJSON（串口 AGENT_LOG:…）：配合 scripts/agent-ingest-serial.sh → .cursor/debug-35ce7e.log
# AGENT_NDJSON = true
# x86_64：AMD 显示 1002:03xx（Polaris/RX550、APU 等）PCI/BAR 分类 + GOP handoff（QEMU -vga std 无 AMD GPU 则静默跳过）
AMD_IGPU = true
# AMD_IGPU_DEFER_PROBE = true
# AMD_KMS_EXPERIMENTAL = true
# Intel 默认开（与 AMD 可并存；帧缓冲解析链 Intel 先于 AMD）
INTEL_IGPU = true
# x86_64：NVIDIA 10DE 显示 PCI（解析链在 Intel 之前；无硬件则静默）。混合显卡时 NVIDIA_HDMI_SYNC 建议 false
# NVIDIA_GPU = true
# NVIDIA_GPU_DEFER_PROBE = false
# NVIDIA_KMS_EXPERIMENTAL = false
# NVIDIA_HDMI_SYNC = false
# LoongArch 龙芯核显 PCI（0014）；Makefile 按 ARCH 默认 true/false，亦可在此覆盖
# LOONGSON_IGPU = true
# LOONGSON_IGPU_DEFER_PROBE = false
# LOONGSON_KMS_EXPERIMENTAL = false
# INTEL_IGPU_DEFER_PROBE = true  — PCI/BAR 探测延到首帧 framebuffer 解析后
# INTEL_KMS_EXPERIMENTAL = true  — 允许 Intel 显示 MMIO 试探读（默认仅 handoff）
# DESKTOP_IDLE_SPIN = false     — 若不想桌面循环短自旋（默认与 Makefile 为 true，利于 QEMU 输入）
# 壁纸：桌面下 Ctrl+Alt+F9 循环预设（见 docs/cn/AeroDesktopRuntime.md）；QEMU 输入见 Makefile virtio-mouse-pci
