name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  zig-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder wallpaper PNGs (build.zig requires paths)
        run: bash scripts/fetch-assets.sh

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Zig fmt check
        run: zig fmt --check src boot tests build.zig build.zig.zon

      - name: Compliance phrase scan (src/boot)
        run: bash scripts/verify-compliance.sh

      - name: Docs relative link check
        run: bash scripts/check-docs-links.sh

      - name: Contract matrix stub scan (E3 anchor)
        run: bash scripts/contract_matrix_scan.sh

      - name: Install smoke deps (QEMU MBR + binutils + ISO tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 binutils python3 make xorriso dosfstools mtools

      - name: Unit tests (incl. phase-4 dwm ABI / wow64 / ntfs hive anchors; see MVT_NT61.md)
        run: zig build test

      - name: x86_64 resolution compile matrix (--quick)
        run: bash scripts/test_x86_resolution_matrix.sh --quick

      - name: Desktop Aero freestanding static library (A2 build path)
        run: zig build desktop-aero-freestanding

      - name: Kernel (x86_64, Debug)
        run: zig build kernel -Darch=x86_64

      - name: Kernel install (x86_64, ReleaseSafe)
        run: zig build install -Darch=x86_64 -Doptimize=ReleaseSafe

      - name: ZBM library (x86_64) + UEFI ZBM (x86_64, aarch64)
        run: |
          zig build zbm
          zig build uefi -Darch=x86_64
          zig build uefi -Darch=aarch64

      - name: Kernel + ZBM objects (aarch64, riscv64, loongarch64)
        run: |
          zig build kernel -Darch=aarch64
          zig build kernel -Darch=aarch64 -Ddesktop-full=true
          zig build kernel -Darch=riscv64
          zig build kernel -Darch=loongarch64
          # Named ZBM object steps are registered only when -Darch matches (see build.zig).
          zig build zbm-riscv64-uefi -Darch=riscv64
          zig build zbm-loongarch-uefi -Darch=loongarch64

      # 可选收紧串口：export CI_SMOKE_MIN_SERIAL=32（见 scripts/smoke-qemu-mbr.sh --min-serial-bytes）
      - name: QEMU serial smoke (ZBM MBR, headless)
        run: bash scripts/ci-qemu-smoke.sh

      - name: UEFI ISO artifact (x86_64 ZBM)
        run: |
          mkdir -p build/test-results
          ISO=build/test-results/zircon-ci-smoke.iso
          test -f zig-out/bin/kernel
          EFI=zig-out/bin/BOOTX64.efi
          test -f "$EFI" || EFI=zig-out/bin/BOOTX64.EFI
          test -f "$EFI"
          bash scripts/build/mkiso-uefi-zbm.sh "$ISO" zig-out/bin/kernel "$EFI" x86_64 ci-smoke release
