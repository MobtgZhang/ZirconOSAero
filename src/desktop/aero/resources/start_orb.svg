<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主体蓝色径向渐变：中心偏亮蓝，往边缘加深 -->
    <radialGradient id="orbBg" cx="45%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#5AA8E8"/>
      <stop offset="45%" stop-color="#2878C8"/>
      <stop offset="100%" stop-color="#104898"/>
    </radialGradient>
    <!-- 左上角高光：小而精 -->
    <radialGradient id="orbHighlight" cx="32%" cy="26%" r="38%">
      <stop offset="0%" stop-color="white" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- 外环描边 -->
    <linearGradient id="orbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8E4FF"/>
      <stop offset="50%" stop-color="#58A8E0"/>
      <stop offset="100%" stop-color="#2868B0"/>
    </linearGradient>
  </defs>
  <!-- 外环 -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#orbRing)" stroke-width="2" opacity="0.85"/>
  <!-- 主体（蓝底） -->
  <circle cx="32" cy="32" r="29" fill="url(#orbBg)"/>
  <!-- 左上角高光（椭圆，不能太大以免遮挡 logo） -->
  <ellipse cx="24" cy="22" rx="14" ry="10" fill="url(#orbHighlight)"/>
  <!-- Windows Z 形 logo（居中，白色粗线条） -->
  <!-- 顶部横线 -->
  <line x1="18" y1="20" x2="46" y2="20" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <!-- 斜线（↘） -->
  <line x1="46" y1="20" x2="18" y2="44" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <!-- 底部横线 -->
  <line x1="18" y1="44" x2="46" y2="44" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
</svg>
