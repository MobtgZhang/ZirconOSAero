# ZirconOSAero Boot Configuration
# Controls boot-time behavior and early initialization.

[boot]
timeout = 5
default_entry = normal
verbose = false
splash_enabled = true

[multiboot]
magic = 0x36D76289
cmdline_max = 256

# Early boot / ZBM preferred framebuffer string (synced from build.conf RESOLUTION by sync_resolution_config.py)
[display]
gfxmode = 1600x900x32
gfxpayload = keep

[uefi]
secure_boot = false
resolution = 1600x900

[zbm]
bcd_path = \\Boot\\BCD
loader_path = \\Boot\\zbm.efi
menu_timeout = 10

# 指针设备策略不在此文件配置：见 zig build `-Dps2_mouse_with_virtio`、`-Dusb_xhci` / `-Dusb_ehci` 与 docs/cn/PointerPolicy_NT61.md §4。
