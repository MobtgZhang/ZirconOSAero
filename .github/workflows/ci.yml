name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  zig-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Unit tests (heap + SSDT)
        run: zig build test

      - name: Kernel (x86_64)
        run: zig build kernel -Darch=x86_64
