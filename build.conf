# ZirconOSAero (NT 6.1 / Windows 7 风格) — 构建配置
# 覆盖方式: make DESKTOP=aero BOOT_METHOD=uefi
#
# 本仓库仅使用自研 ZirconOS Boot Manager (ZBM)，不包含 GRUB。

# ── Architecture ──
# Supported: x86_64, aarch64, loongarch64, riscv64, mips64el
ARCH = loongarch64

# ── Boot Method ──
# mbr   — Legacy BIOS (Master Boot Record) → ZBM
# uefi  — UEFI firmware (GPT + ESP) → ZBM
# （x86/aarch64 ISO/ESP 含义；LoongArch 下 make run 的 QEMU 方式见 LOONGARCH64_QEMU_MODE）
BOOT_METHOD = uefi

# ── LoongArch QEMU（仅 ARCH=loongarch64 时有效）──
# uefi   — -bios + ESP + startup.nsh，需 QEMU_EFI.fd；ZBM 经 fix_pe_reloc 修正后应可加载
# LOONGARCH64_USE_C_STUB = 1 时使用 C stub，否则使用 Zig ZBM
# kernel — -kernel 直启：内核内 ZBM 风格菜单（串口可见），ramfb 在部分 QEMU 上无显示
LOONGARCH64_QEMU_MODE = uefi

# ── Bootloader ──
# 仅 zbm（本仓库已移除 GRUB 依赖链）
BOOTLOADER = zbm

# ── Desktop Theme ──
# 默认 Aero（Vista/7 玻璃风格），与 NT 6.x 视觉一致
DESKTOP=aero

# ── Build Optimization ──
OPTIMIZE = Debug

# ── Display / QEMU ──
RESOLUTION = 1024x768x32
QEMU_MEM = 512M

# ── Features ──
ENABLE_IDT = true
DEBUG_LOG = true
