# ZirconOSAero (NT 6.1 / Windows 7 风格) — 构建配置
# 覆盖方式: make DESKTOP=aero BOOT_METHOD=uefi
#
# 本仓库仅使用自研 ZirconOS Boot Manager (ZBM)，不包含 GRUB。

# ── Architecture ──
# Supported: x86_64, aarch64, loongarch64, riscv64, mips64el
ARCH = x86_64

# ── Boot Method ──
# mbr   — Legacy BIOS (Master Boot Record) → ZBM
# uefi  — UEFI firmware (GPT + ESP) → ZBM
BOOT_METHOD = uefi

# ── Bootloader ──
# 仅 zbm（本仓库已移除 GRUB 依赖链）
BOOTLOADER = zbm

# ── Desktop Theme ──
# 默认 Aero（Vista/7 玻璃风格），与 NT 6.x 视觉一致
DESKTOP = aero

# ── Build Optimization ──
OPTIMIZE = Debug

# ── Display / QEMU ──
RESOLUTION = 1024x768x32
QEMU_MEM = 512M

# ── Features ──
ENABLE_IDT = true
DEBUG_LOG = true
