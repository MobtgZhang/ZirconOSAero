# ZirconOSAero System Configuration
# This file defines core operating system parameters.

[system]
hostname = ZirconOSAero
version = 6.1.7601
csd_version = Service Pack 1
service_pack_major = 1
service_pack_minor = 0
suite_mask = 0x0100
product_type = 1
# NT 6.1 兼容层对外宣称的处理器族（非 QEMU/固件实际 CPU）；宿主架构见串口 `host_cpu=`。
nt_product_arch = x86_64
build_type = debug
max_cpus = 4
tick_rate_hz = 100

[memory]
heap_size_kb = 4096
frame_size = 4096
# 策略上界：与 Windows 7 Ultimate x64 公开规格（约 192 GiB RAM）对齐；实际可管理帧数以 `zig build -Dphys_track_gb` 为硬上限。
max_physical_mb = 196608
stack_size_kb = 64
user_stack_size_kb = 256
kernel_heap_start = 0xFFFF800000000000

[scheduler]
max_processes = 256
max_threads = 1024
time_slice_ms = 20
priority_levels = 32
idle_priority = 0
default_priority = 8

[display]
default_width = 1440
default_height = 900
default_bpp = 32
text_cols = 80
text_rows = 25
font_height = 16
font_width = 8

[console]
serial_enabled = true
serial_baud = 115200
serial_port = 0x3F8
vga_enabled = true
log_level = info

[filesystem]
root_fs = fat32
root_device = C
ntfs_device = D
max_open_files = 256
max_mount_points = 16
path_max = 260

[network]
enabled = false
dhcp = true
hostname = ZirconOSAero
dns_primary = 8.8.8.8
dns_secondary = 8.8.4.4

[security]
default_token_privileges = standard
max_sid_count = 64
audit_enabled = false

[win32]
subsystem_enabled = true
wow64_enabled = true
max_windows = 128
max_gdi_objects = 1024
default_shell = explorer

[drivers]
video_stack = true
vga_driver = true
hdmi_driver = true
framebuffer_driver = true
display_manager = true
