name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  zig-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Zig fmt check
        run: zig fmt --check src boot tests build.zig build.zig.zon

      - name: Compliance phrase scan (src/boot)
        run: bash scripts/verify-compliance.sh

      - name: Install smoke deps (QEMU MBR + binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 binutils python3 make

      - name: Unit tests (heap + SSDT + se token)
        run: zig build test

      - name: Kernel (x86_64, Debug)
        run: zig build kernel -Darch=x86_64

      - name: Kernel install (x86_64, ReleaseSafe)
        run: zig build install -Darch=x86_64 -Doptimize=ReleaseSafe

      - name: QEMU serial smoke (ZBM MBR, headless)
        run: bash scripts/ci-qemu-smoke.sh

      - name: Kernel (aarch64 cross-compile smoke)
        run: zig build kernel -Darch=aarch64
