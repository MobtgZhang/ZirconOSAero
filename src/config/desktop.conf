# ZirconOSAero Desktop Configuration
# Defines desktop environment parameters for the shell.
# Referenced by: src/config/defaults.zig → src/config/config.zig
#
# 本仓库仅内置 Windows 7 Aero（NT 6.1）壳：源码与资源在 src/desktop/aero/。
# color_scheme（Aero）：zircon_blue | zircon_graphite | zircon_aurora | highcontrast

[desktop]
theme = aero
color_scheme = zircon_blue
shell = zshell
# Explorer shell strings: en | zh
explorer_lang = en
# 资源管理器盘符：verbose（Local Disk (C:)）| pe_compact（C:）；Windows 宿主构建忽略此项、恒为紧凑
explorer_drive_label_style = verbose
auto_logon = false
auto_logon_user =

[resolution]
width = 1920
height = 1080
bpp = 32
refresh_rate = 60
dpi = 96

[wallpaper]
style = solid_color
color = 0x081222
path = src/desktop/aero/resources/wallpapers/Landscapes/zircon_harmony.png

[display]
driver = auto
vsync = true
double_buffer = true
triple_buffer = false
# present_full_flip 默认 true（整幅 memcpy，QEMU/LoongArch ramfb 更稳）。若鼠标跟手卡顿可改为 false（脏矩形 flip）：
# present_full_flip = false
# x86_64 可选：与 display.vsync 同时为真时，按调度 tick 限制 present 最小间隔（毫秒，0=关）。非真实 vblank，仅略减撕裂感。
# present_coarse_frame_pacing_ms = 16
seed_gop_to_back = false
fall_back_single_on_alloc_fail = true
hardware_cursor = true
max_monitors = 4
primary_monitor = 0

[video_driver]
vga_enabled = true
vga_base = 0xB8000
framebuffer_enabled = true
hdmi_enabled = false
hdmi_audio = false
edid_detect = true

[dwm]
composition_enabled = true
mica_enabled = false
mica_opacity = 210
mica_blur_radius = 60
mica_luminosity = 160
mica_tint_color = 0x1C1C1C
mica_tint_opacity = 70
acrylic2_enabled = true
acrylic2_luminosity_blend = 160
acrylic_noise_opacity = 4
glass_enabled = true
glass_opacity = 210
glass_blur_radius = 20
glass_saturation = 180
glass_tint_color = 0x1C1C1C
glass_tint_opacity = 70
animation_enabled = true
animation_implicit = true
peek_enabled = true
shadow_enabled = true
shadow_layers = 5
shadow_size = 12
shadow_spread = 4
vsync_compositor = true
round_corners = true
corner_radius = 8
sdf_antialias = true
snap_layout_enabled = true
snap_zones = 6
taskbar_centered = true
widget_panel_enabled = true
quick_settings_enabled = true
drr_enabled = true
drr_min_hz = 60
drr_max_hz = 120
auto_hdr = false
shell_process_split = true
depth_shadow_layers = 5
virtual_desktops = 8
mpo_enabled = true

[mouse]
sensitivity = 10
acceleration = true
acceleration_threshold = 6
smooth_scrolling = true
interpolation_enabled = true
interpolation_steps = 4
poll_rate = 125
cursor_trail = false
cursor_shadow = true

[window_manager]
max_windows = 128
max_z_order = 256
focus_follows_mouse = false
snap_to_edge = true
animate_windows = true
animation_speed = 150
shadow_enabled = true
shadow_size = 8

[taskbar]
position = bottom
height = 40
centered = false
auto_hide = false
show_clock = true
show_tray = true
show_search = true
show_task_view = true
show_widgets = true
group_similar = true
glass_enabled = true
show_peek = true
pill_indicators = true

[startmenu]
style = aero
centered = false
show_pinned = true
show_recommended = true
show_all_apps = true
show_search = true
show_user_profile = true
show_power = true
mica_enabled = true
corner_radius = 8
user_display_name =
account_subtitle = Standard user

[icons]
show_desktop_icons = true
icon_size = 48
icon_spacing_x = 80
icon_spacing_y = 90
auto_arrange = true
align_to_grid = true
show_computer = true
show_documents = true
show_network = true
show_recycle_bin = true
show_browser = true
show_icon_shadows = true

[login]
welcome_screen = true
fast_user_switching = true
screen_saver_timeout = 600
lock_timeout = 300
panel_width = 400
panel_height = 320
glass_panel = true

[fonts]
system_font = Noto Sans
system_font_size = 9
titlebar_font = Noto Sans
titlebar_font_size = 9
menu_font = Noto Sans
menu_font_size = 9
icon_font = Noto Sans
icon_font_size = 9
clock_font = Noto Sans
clock_font_size = 9
monospace_font = Source Code Pro
monospace_font_size = 10
cjk_font = Noto Sans CJK SC
cjk_font_size = 9
serif_font = Noto Serif
serif_font_size = 9
font_search_path = src/fonts
